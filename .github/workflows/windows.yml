name: Windows x64 VST3
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate Windows VST3 lifecycle and editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $validator = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (!$validator) { throw 'pluginval executable not found' }
          $bundle = (Resolve-Path 'build/FoundationBass_artefacts/Release/VST3/Foundation Bass.vst3').Path
          & $validator.FullName --strictness-level 5 --random-seed 12345 --timeout-ms 120000 --validate $bundle 2>&1 | Tee-Object -FilePath pluginval-windows.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $tail = ((Get-Content pluginval-windows.log -Tail 65) -join '%0A').Replace('%','%25').Replace('%250A','%0A')
            Write-Output "::error::pluginval exit $result. $tail"
            exit $result
          }
      - name: Package Windows x64 VST3
        shell: pwsh
        run: |
          $bundle = 'build/FoundationBass_artefacts/Release/VST3/Foundation Bass.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/Foundation Bass.vst3'
          if (!(Test-Path $binary)) { throw 'Windows x64 VST3 binary was not produced' }
          Compress-Archive -LiteralPath $bundle -DestinationPath Foundation-Bass-Windows-x64.zip
      - name: REAPER 7.86 x64 integration
        shell: pwsh
        run: |
          try { & ./scripts/test-reaper-windows.ps1 } catch {
            $message = $_.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Foundation-Bass-Windows-x64
          path: |
            Foundation-Bass-Windows-x64.zip
            pluginval-windows.log
            reaper-windows.log
            build/FoundationBass_artefacts/Release/Standalone/*.exe
      - name: Publish downloadable Windows build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'windows-${{ github.sha }}'
          gh release create $tag Foundation-Bass-Windows-x64.zip pluginval-windows.log reaper-windows.log --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Foundation Bass 0.1.1 Windows x64 compatibility' --notes 'Windows x64: software/GDI editor rendering and static C++ runtime. DSP, processor, native editor lifecycle, pluginval level 5 and REAPER 7.86 integration checks passed. Original user crash cause remains unconfirmed; Studio One is not tested. Close your DAW and replace the entire previous .vst3 folder. Provisional artwork unchanged.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
